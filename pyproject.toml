[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "land-plot-finder"
version = "1.3.0"
description = "Standalone land listing monitor with a local web dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "apscheduler>=3.10,<4",
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "google-api-python-client>=2.120,<3",
  "google-auth>=2.28,<3",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.1,<4",
  "python-dotenv>=1.0,<2",
  "SQLAlchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
land-plot-finder = "app.cli:main"
land-plot-finder-web = "app.web:main"
land-plot-finder-desktop = "app.desktop:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
